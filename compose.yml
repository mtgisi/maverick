services:
  maverick:
    build: .
    container_name: maverick
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: America/Chicago
    volumes:
      - ./claude-config:/home/node/.claude   # Claude Code subscription auth (shared OAuth token)
      - ./data:/app/data                     # maverick sqlite (memories, sessions, google tokens, etc.)
      # To enable the read-only container-status tool, set ENABLE_DOCKER_TOOL=true in .env
      # and uncomment the next line (mounts docker socket read-only):
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      proxy: {}
      # Health share for the accountability bot (server/share.js). The share listener binds
      # to THIS address only (SHARE_BIND in .env), so it is unreachable from `proxy` and the LAN.
      share:
        ipv4_address: 172.28.0.2

  # Self-hosted speech-to-text for watch dictation (private; audio never leaves the server).
  # Internal only — no Caddy block, not exposed publicly. Model cached in the named volume.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: maverick-whisper
    restart: unless-stopped
    environment:
      ASR_MODEL: base
      ASR_ENGINE: openai_whisper
    volumes:
      - whisper-cache:/root/.cache
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
  # Internal-only: no route off the host, no published ports. maverick and the
  # accountability bot are the only members. See docs/HEALTH-SHARE.md.
  share:
    name: maverick-share
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/29

volumes:
  whisper-cache:
